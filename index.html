<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed canvas stage. Neon heart sits a little above the middle, the script words beneath it, a soft vignette on top. Dark by choice, single look. */
:root {
  --bg: #050205;
  --word: #ffd84a;
  --script: 'Great Vibes', 'Snell Roundhand', 'Brush Script MT', cursive, serif;
  --ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--word);
  font-family: var(--script);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}

#c {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: manipulation;
}

.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.72) 100%);
}

.word {
  position: fixed;
  left: 0;
  right: 0;
  top: 66%;
  height: 2.7em;
  margin: 0;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--script);
  font-weight: 400;
  font-size: 3rem;
  line-height: 1.2;
  color: var(--word);
  transition: color 0.9s ease;
  pointer-events: none;
}

.ph {
  position: absolute;
  inset: 0;
  box-sizing: border-box;
  text-align: center;
  white-space: normal;
  padding-left: inherit;
  padding-right: inherit;
}

.wd {
  display: inline-block;
  white-space: nowrap;
}

.ch {
  display: inline-block;
  opacity: 0;
  transform: translateY(0.4em) scale(0.9);
  filter: blur(8px);
  text-shadow: 0 0 0.1em currentColor, 0 0 0.4em currentColor;
  transition: opacity 0.7s ease, transform 0.85s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.7s ease, color 0.9s ease;
  transition-delay: calc(var(--i) * 55ms);
}

.ph.in .ch {
  opacity: 1;
  transform: none;
  filter: blur(0);
  animation: wave 2.6s ease-in-out infinite;
  animation-delay: calc(var(--i) * 90ms + 1s);
}

.ph.instant .ch { transition: none; }

.ph.out .ch {
  opacity: 0;
  transform: translateY(-0.45em) scale(1.06);
  filter: blur(9px);
  transition-delay: calc(var(--i) * 22ms);
  animation: none;
}

/* letters that dissolve while the heart is being erased */
.ph.in .ch.gone,
.ph.out .ch.gone {
  opacity: 0;
  filter: blur(10px);
  transform: translate(var(--dx, 0px), var(--dy, -40px)) rotate(var(--rot, 0deg)) scale(1.35);
  transition: opacity 0.9s ease-in, transform 1.1s ease-out, filter 0.9s ease-in;
  transition-delay: 0s;
  animation: none;
}

@keyframes wave {
  0%, 100% { text-shadow: 0 0 0.1em currentColor, 0 0 0.4em currentColor; }
  50% { text-shadow: 0 0 0.12em #fff, 0 0 0.6em currentColor, 0 0 1.1em currentColor; }
}

.hint {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  margin: 0;
  text-align: center;
  font-family: var(--ui);
  font-size: 12px;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.5);
  pointer-events: none;
  animation: hintFade 10s ease forwards;
}

@keyframes hintFade {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .ch, .ph.in .ch { transition: none; animation: none; opacity: 1; transform: none; filter: none; }
  .hint { animation: none; opacity: 0; }
}
</style>

</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<p class="word" id="word"></p>
<p class="hint" id="hint">Tap for hearts &middot; double-tap for the next colour</p>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var wordEl = document.getElementById('word');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var PI2 = Math.PI * 2;

  /* Colours of each round. Edit or add entries to restyle the show. */
  var PAL = [
    { head: [255, 248, 170], mid: [255, 190, 40],  tail: [255, 64, 16],  text: '#ffd84a', glow: [150, 50, 0] },
    { head: [255, 236, 255], mid: [210, 120, 255], tail: [150, 40, 255], text: '#e9b8ff', glow: [75, 14, 120] },
    { head: [226, 255, 175], mid: [90, 255, 150],  tail: [24, 214, 106], text: '#8dffb8', glow: [0, 80, 34] }
  ];
  /* One line per heart: heart 1 shows line 1, heart 2 line 2, heart 3 line 3, then it starts over. */
  var PHRASES = ['Hey Riya \uD83E\uDEB7', 'I know you can never be mine \u2763\uFE0F', 'Even so, I love you.'];

  var N = 300;
  var DUR = [3800, 2400, 3400, 2600];   /* draw, hold, erase, orb (ms) */

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }
  function sm(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

  /* ---------- sprites ---------- */
  function mkHeart(col) {
    var c = document.createElement('canvas');
    c.width = c.height = 48;
    var g = c.getContext('2d');
    g.scale(1.5, 1.5);
    g.shadowColor = rgba(col, 1);
    g.shadowBlur = 5;
    g.fillStyle = rgba(col, 1);
    g.beginPath();
    g.moveTo(16, 27);
    g.bezierCurveTo(5, 19, 3, 11, 7, 7);
    g.bezierCurveTo(11, 3, 16, 6, 16, 10);
    g.bezierCurveTo(16, 6, 21, 3, 25, 7);
    g.bezierCurveTo(29, 11, 27, 19, 16, 27);
    g.fill();
    return c;
  }
  var HS = [];
  PAL.forEach(function (p) {
    HS.push(mkHeart(mix(p.head, [255, 255, 255], 0.35)));
    HS.push(mkHeart(p.mid));
    HS.push(mkHeart(p.tail));
  });

  /* ---------- state ---------- */
  var W, H, DPR, cx, cy, S, k, sc, ss;
  var pts = [];
  var ringPath = null;
  var P = [], FH = [], rings = [], pops = [], shoot = [], sparks = [];
  var stars = [], bokeh = [];
  var ph = 1, phT = 600, cyc = 0, dir = 1, pi = 0, pal = PAL[0];
  var bs = 1, ox = 0, oy = 0, tpx = 0, tpy = 0, pxs = 0, pys = 0;
  var beatPulse = 0, lastBeat = -1, time = 0;
  var dens = 0.3, q = 1, ema = 0.016, qT = 0;
  var glowCur = PAL[0].glow.slice(), colCur = PAL[0].mid.slice();
  var acc = 0, accAmb = 0, accFH = 0, shootT = 3, wordIdx = 0, wordT = 0;
  var fwDone = [false, false];
  var windX = 0, windY = 0;
  var ptr = { x: 0, y: 0, on: false, t: 0 };
  var lastTap = 0;
  var last = performance.now();
  var tp = [0, 0];
  var eraseEls = [], eraseIdx = 0;
  var maxD = 800, tipD = false, tipE = false, gTotal = 0, gAbs = 0, gOn = false, gtx = 0, gty = 0, gf = 1, gpal = 0, orbT = 0;

  for (var si = 0; si < 150; si++) {
    stars.push({ x: Math.random(), y: Math.random(), r: rnd(0.5, 1.6), ph: rnd(0, PI2), sp: rnd(0.8, 2.4), d: rnd(0.2, 1) });
  }
  for (var bi0 = 0; bi0 < 8; bi0++) {
    bokeh.push({ x: Math.random(), y: Math.random(), r: rnd(0.07, 0.2), vx: rnd(-0.006, 0.006), vy: rnd(-0.008, 0.004), a: rnd(0.04, 0.09) });
  }

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W * 0.72, H * 0.5);
    k = S / 32;
    sc = Math.max(0.6, S / 450);
    ss = Math.max(0.8, S / 360);
    cx = W / 2;
    cy = H * 0.42;
    maxD = Math.max(W, H);
    pts.length = 0;
    ringPath = new Path2D();
    for (var i = 0; i <= N; i++) {
      var t = Math.PI * 2 * i / N;
      var s = Math.sin(t);
      var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      var px = 16 * s * s * s * k, py = -(y + 2.5) * k;
      pts.push([px, py]);
      if (i % 3 === 0) { if (i === 0) ringPath.moveTo(px, py); else ringPath.lineTo(px, py); }
    }
    ringPath.closePath();
    fit();
  }

  function fit() {
    wordEl.style.fontSize = Math.max(26, Math.min(S * 0.17, 86)) + 'px';
    wordEl.style.top = (cy + S * 0.452 + H * 0.045) + 'px';
  }

  /* ---------- geometry helpers ---------- */
  function ptAt(f) {
    if (f <= 0) { tp[0] = pts[0][0]; tp[1] = pts[0][1]; return tp; }
    if (f >= N) { tp[0] = pts[N][0]; tp[1] = pts[N][1]; return tp; }
    var i = Math.floor(f), fr = f - i;
    tp[0] = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * fr;
    tp[1] = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * fr;
    return tp;
  }
  function X(px) { return cx + ox + dir * px * bs; }
  function Y(py) { return cy + oy + py * bs; }
  function scr(f) {
    var p = ptAt(f);
    return [X(p[0]), Y(p[1])];
  }

  /* ---------- text ---------- */
  function groups(text) {
    var cs = Array.from(text), out = [];
    for (var i = 0; i < cs.length; i++) {
      var c = cs[i], cp = c.codePointAt(0);
      var prev = out.length ? out[out.length - 1] : '';
      if (out.length && (cp === 0xFE0F || cp === 0x200D || (cp >= 0x1F3FB && cp <= 0x1F3FF) || prev.charAt(prev.length - 1) === '‍')) {
        out[out.length - 1] += c;
      } else out.push(c);
    }
    return out;
  }

  function showPhrase(text, instant) {
    var old = wordEl.querySelector('.ph:not(.out)');
    if (old) {
      old.classList.remove('in');
      old.classList.add('out');
      setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 1300);
    }
    var el = document.createElement('span');
    el.className = 'ph' + (instant ? ' instant' : '');
    var gs = groups(text), wd = null, idx = 0;
    for (var i = 0; i < gs.length; i++) {
      if (gs[i] === ' ') { el.appendChild(document.createTextNode(' ')); wd = null; continue; }
      if (!wd) { wd = document.createElement('span'); wd.className = 'wd'; el.appendChild(wd); }
      var c = document.createElement('span');
      c.className = 'ch';
      c.style.setProperty('--i', idx++);
      c.textContent = gs[i];
      wd.appendChild(c);
    }
    wordEl.appendChild(el);
    if (instant) { el.classList.add('in'); }
    else {
      void el.offsetWidth;
      requestAnimationFrame(function () { el.classList.add('in'); });
    }
  }

  /* ---------- particles ---------- */
  function ci3() { var r = Math.random(); return pi * 3 + (r < 0.4 ? 0 : r < 0.75 ? 1 : 2); }
  function dust(x, y, vx, vy, life, size, ci, kind) {
    if (P.length >= 3600 * q) return;
    P.push({ x: x, y: y, vx: vx, vy: vy, age: 0, life: life, size: size, ci: ci, kind: kind, tw: Math.random() * PI2, fade: 1, g: 0, ab: 0, gd: 0 });
  }
  function burst(x, y, n, speed, life, kind, cpi) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * PI2, sp = speed * (0.25 + Math.random() * 0.75);
      var r = Math.random();
      dust(x, y, Math.cos(a) * sp, Math.sin(a) * sp, life * rnd(0.6, 1.2), rnd(3, 6.5) * ss,
        cpi * 3 + (r < 0.4 ? 0 : r < 0.75 ? 1 : 2), kind);
    }
  }
  function killLetter(el) {
    var r = el.getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    el.style.setProperty('--dx', (windX / sc * 0.5 + rnd(-30, 30)) + 'px');
    el.style.setProperty('--dy', rnd(-90, -30) + 'px');
    el.style.setProperty('--rot', rnd(-25, 25) + 'deg');
    el.classList.add('gone');
    var n = Math.round(14 * q);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * PI2, sp = rnd(10, 80) * sc;
      dust(x + rnd(-r.width / 2, r.width / 2), y + rnd(-r.height / 3, r.height / 3),
        Math.cos(a) * sp + windX, Math.sin(a) * sp + windY, rnd(1.2, 2.8), rnd(2.8, 6) * ss, ci3(), 0);
    }
  }

  function tipBlast() {
    var t = scr(N / 2);
    pops.push({ x: t[0], y: t[1], t0: time, type: 1, pi: pi });
    var n = Math.round(520 * q);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * PI2, sp = maxD * (0.08 + 0.62 * Math.pow(Math.random(), 0.8));
      dust(t[0], t[1], Math.cos(a) * sp, Math.sin(a) * sp, rnd(2.8, 4.6), rnd(2.8, 6.5) * ss, ci3(), 5);
    }
  }

  function firework() {
    var x = rnd(W * 0.12, W * 0.88), y = rnd(H * 0.08, H * 0.34);
    pops.push({ x: x, y: y, t0: time, type: 2, pi: pi });
    burst(x, y, Math.round(36 * q), 230 * sc, 1.8, 2, pi);
  }

  /* ---------- phase changes ---------- */
  function dipPos() { return [cx + ox, cy + oy + pts[0][1] * bs]; }

  function enter(n) {
    var d;
    if (n > 3) {
      cyc++;
      dir = (cyc % 2 === 0) ? 1 : -1;
      pi = cyc % PAL.length;
      pal = PAL[pi];
      ph = 0;
      tipD = false;
      wordEl.style.color = pal.text;
      showPhrase(PHRASES[cyc % PHRASES.length], false);
      d = dipPos();
      pops.push({ x: d[0], y: d[1], t0: time, type: 1, pi: pi });
      burst(d[0], d[1], Math.round(80 * q), 170 * sc, 1.6, 0, pi);
      return;
    }
    ph = n;
    if (n === 2) {
      tipE = false;
      eraseEls = Array.prototype.slice.call(wordEl.querySelectorAll('.ph:not(.out) .ch'));
      if (dir < 0) eraseEls.reverse();
      eraseIdx = 0;
    }
    if (n === 3) {
      gTotal = 0; gAbs = 0;
      for (var gi2 = 0; gi2 < P.length; gi2++) {
        if (P[gi2].kind !== 3) { P[gi2].g = 1; P[gi2].gd = Math.random() * 1.1; gTotal++; }
      }
    }
    if (n === 1) {
      d = dipPos();
      pops.push({ x: d[0], y: d[1], t0: time, type: 0, pi: pi });
      burst(d[0], d[1], Math.round(45 * q), 120 * sc, 1.3, 0, pi);
      fwDone = [false, false];
    }
  }

  /* ---------- drawing pieces ---------- */
  function strokeRange(a, b, hot) {
    if (b - a < 0.5) return;
    var CH = 9;
    var base = Math.max(2, S * 0.0105) * (1 + 0.05 * Math.sin(time * 4)) * (1 + 0.35 * beatPulse);
    var passes = [
      { w: S * 0.085, al: 0.04, wh: 0 },
      { w: S * 0.045, al: 0.08, wh: 0 },
      { w: S * 0.02, al: 0.22, wh: 0 },
      { w: base, al: 1, wh: 0.28 }
    ];
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var pi2 = 0; pi2 < passes.length; pi2++) {
      var ps = passes[pi2];
      ctx.globalCompositeOperation = ps.al < 0.5 ? 'lighter' : 'source-over';
      ctx.lineWidth = ps.w;
      for (var s = a; s < b; s += CH) {
        var e = Math.min(s + CH, b);
        var u = (s + e) / 2 / N;
        var g = 0.12 + 0.88 * Math.pow(0.5 - 0.5 * Math.cos(PI2 * u), 0.9);
        if (hot && b - e < 12) g = 1;
        var col = mix(pal.tail, pal.head, g);
        if (ps.wh) col = mix(col, [255, 255, 255], ps.wh);
        ctx.strokeStyle = rgba(col, ps.al);
        ctx.beginPath();
        var p0 = ptAt(s);
        ctx.moveTo(X(p0[0]), Y(p0[1]));
        for (var j = Math.floor(s) + 1; j < e; j++) ctx.lineTo(X(pts[j][0]), Y(pts[j][1]));
        var p1 = ptAt(e);
        ctx.lineTo(X(p1[0]), Y(p1[1]));
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function glow(x, y, r, col, a) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, a));
    g.addColorStop(0.35, rgba(col, a * 0.45));
    g.addColorStop(1, rgba(col, 0));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.globalCompositeOperation = 'source-over';
  }

  function flare(x, y, r, col, a) {
    glow(x, y, r * 1.6, col, a * 0.8);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(mix(col, [255, 255, 255], 0.7), a);
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - r * 2.2, y); ctx.lineTo(x + r * 2.2, y);
    ctx.moveTo(x, y - r * 1.5); ctx.lineTo(x, y + r * 1.5);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawRays() {
    if (typeof ctx.createConicGradient !== 'function' || q < 0.6) return;
    var n = 14;
    var g = ctx.createConicGradient(time * 0.12, cx + ox, cy + oy);
    var c1 = rgba(colCur, 0.06), c0 = rgba(colCur, 0);
    for (var i = 0; i <= n * 2; i++) g.addColorStop(i / (n * 2), i % 2 ? c0 : c1);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    var m = ctx.createRadialGradient(cx + ox, cy + oy, S * 0.2, cx + ox, cy + oy, Math.max(W, H) * 0.6);
    m.addColorStop(0, 'rgba(0,0,0,0)');
    m.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = m;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawBackdrop(dt) {
    var kk = 1 - Math.exp(-dt * 2.2);
    for (var i = 0; i < 3; i++) {
      glowCur[i] += (pal.glow[i] - glowCur[i]) * kk;
      colCur[i] += (pal.mid[i] - colCur[i]) * kk;
    }
    var R = Math.max(W, H) * 0.7;
    var inten = ph === 1 ? 0.95 : ph === 3 ? 0.8 : 0.65;
    var gr = ctx.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, R);
    gr.addColorStop(0, rgba(glowCur, 0.58 * inten));
    gr.addColorStop(0.45, rgba(glowCur, 0.2 * inten));
    gr.addColorStop(1, rgba(glowCur, 0));
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);

    /* bokeh */
    ctx.globalCompositeOperation = 'lighter';
    for (var b = 0; b < bokeh.length; b++) {
      var o = bokeh[b];
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.x < -0.2) o.x = 1.2; if (o.x > 1.2) o.x = -0.2;
      if (o.y < -0.2) o.y = 1.2; if (o.y > 1.2) o.y = -0.2;
      var bx = o.x * W + pxs * 18, by = o.y * H + pys * 12, br = o.r * Math.max(W, H);
      var bg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      bg.addColorStop(0, rgba(colCur, o.a));
      bg.addColorStop(1, rgba(colCur, 0));
      ctx.fillStyle = bg;
      ctx.fillRect(bx - br, by - br, br * 2, br * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawStars() {
    var col = mix(colCur, [255, 255, 255], 0.6);
    var cs = rgba(col, 1);
    ctx.fillStyle = cs;
    var n = Math.round(stars.length * Math.min(1, q + 0.2));
    for (var i = 0; i < n; i++) {
      var s = stars[i];
      var a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(time * s.sp + s.ph));
      var x = s.x * W + pxs * 14 * s.d, y = s.y * H + pys * 9 * s.d;
      ctx.globalAlpha = a * 0.8;
      var r = s.r * (0.8 + 0.4 * ss);
      ctx.fillRect(x - r / 2, y - r / 2, r, r);
      if (s.r > 1.45 && a > 0.7) {
        ctx.globalAlpha = (a - 0.7) * 2;
        ctx.fillRect(x - r * 4, y - 0.4, r * 8, 0.8);
        ctx.fillRect(x - 0.4, y - r * 4, 0.8, r * 8);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFloatHearts(dt) {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = FH.length - 1; i >= 0; i--) {
      var h = FH[i];
      h.age += dt;
      h.y -= h.vy * dt;
      if (h.y < -60) { FH[i] = FH[FH.length - 1]; FH.pop(); continue; }
      var x = h.x + Math.sin(h.age * h.sw + h.ph) * h.sa + pxs * 20 * h.d;
      var fade = Math.min(1, h.age * 1.2) * Math.min(1, (h.y + 60) / 160);
      ctx.globalAlpha = h.al * fade * (0.8 + 0.2 * Math.sin(h.age * 3 + h.ph));
      ctx.drawImage(HS[h.ci], x - h.sz / 2, h.y - h.sz / 2, h.sz, h.sz);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawRings() {
    ctx.save();
    ctx.translate(cx + ox, cy + oy);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = rings.length - 1; i >= 0; i--) {
      var r = rings[i];
      var u = (time - r.t0) / 1.8;
      if (u >= 1) { rings.splice(i, 1); continue; }
      var e = 1 - Math.pow(1 - u, 2.2);
      var s = 1.04 + e * 0.6;
      ctx.save();
      ctx.scale(s, s);
      ctx.lineWidth = Math.max(1, S * 0.006) / s;
      ctx.strokeStyle = rgba(mix(pal.tail, pal.head, 0.5), 0.5 * Math.pow(1 - u, 1.6));
      ctx.stroke(ringPath);
      ctx.restore();
    }
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawPops() {
    for (var i = pops.length - 1; i >= 0; i--) {
      var o = pops[i];
      var life = o.type === 1 ? 1.1 : o.type === 2 ? 0.7 : 0.9;
      var u = (time - o.t0) / life;
      if (u >= 1) { pops.splice(i, 1); continue; }
      var col = PAL[o.pi].head;
      var r = (o.type === 2 ? S * 0.2 : S * 0.75) * (1 - Math.pow(1 - u, 3));
      glow(o.x, o.y, Math.max(2, r * 0.45), col, (o.type === 2 ? 0.55 : 0.8) * (1 - u));
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(col, 0.7 * (1 - u));
      ctx.lineWidth = Math.max(1.5, S * 0.012 * (1 - u));
      ctx.beginPath();
      ctx.arc(o.x, o.y, Math.max(1, r), 0, PI2);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawParticles(dt) {
    var wx = windX, wy = windY;
    for (var i = P.length - 1; i >= 0; i--) {
      var p = P[i];
      p.age += dt;
      if (p.g && !gOn) p.g = 0;
      if (p.g) {
        var s = ph === 3 ? sm((orbT - p.gd) / 0.7) : gf;
        if (s > 0.01) {
          var dx = gtx - p.x, dy = gty - p.y;
          var dd = Math.sqrt(dx * dx + dy * dy);
          var kk = 11 * s;
          p.vx += (dx * kk - dy * kk * 0.5) * dt;
          p.vy += (dy * kk + dx * kk * 0.5) * dt;
          var dg = Math.exp(-5 * s * dt);
          p.vx *= dg; p.vy *= dg;
          var rc = ph === 3 ? maxD * 1.3 * sm((orbT - 0.1) / 1.7) : 1e9;
          if (dd < rc && ((p.ci / 3) | 0) !== gpal) p.ci = gpal * 3 + (p.ci % 3);
          if (dd < 16 * sc && !p.ab && s > 0.4) { p.ab = 1; if (ph === 3) gAbs++; }
        }
        var cap = p.life * 0.4;
        if (p.age > cap) p.age = cap;
      } else if (p.kind === 0) {
        var dr = Math.pow(0.4, dt);
        p.vx = p.vx * dr + wx * 0.5 * dt;
        p.vy = p.vy * dr + wy * 0.5 * dt;
      } else if (p.kind === 2) {
        var d2 = Math.pow(0.35, dt);
        p.vx *= d2; p.vy = p.vy * d2 + 120 * sc * dt;
      } else if (p.kind === 3) {
        p.vy -= 30 * sc * dt;
        p.vx *= Math.pow(0.5, dt);
      } else if (p.kind === 5) {
        var d5 = Math.pow(0.55, dt);
        p.vx *= d5; p.vy *= d5;
      }
      if (p.ab) p.fade -= dt * 4;
      if (p.age >= p.life || p.fade <= 0) { P[i] = P[P.length - 1]; P.pop(); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    ctx.globalCompositeOperation = 'lighter';
    for (var j = 0; j < P.length; j++) {
      var q2 = P[j];
      var u = q2.age / q2.life;
      var al = q2.kind === 1 ? Math.sin(Math.PI * u) : q2.kind === 5 ? Math.pow(Math.sin(Math.PI * u), 0.6) : (1 - u);
      al *= (0.62 + 0.38 * Math.sin(q2.tw + time * 6)) * q2.fade;
      if (al < 0.03) continue;
      ctx.globalAlpha = Math.min(1, al * (q2.kind === 1 ? 0.8 : 1));
      var sz = q2.size;
      ctx.drawImage(HS[q2.ci], q2.x - sz / 2, q2.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawShoot(dt) {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = shoot.length - 1; i >= 0; i--) {
      var s = shoot[i];
      s.age += dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.age > s.life) { shoot.splice(i, 1); continue; }
      var f = 1 - s.age / s.life;
      var tx = s.x - s.vx * 0.18, ty = s.y - s.vy * 0.18;
      var g = ctx.createLinearGradient(s.x, s.y, tx, ty);
      g.addColorStop(0, 'rgba(255,255,255,' + (0.9 * f) + ')');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- main loop ---------- */
  function tune(raw) {
    ema = ema * 0.95 + raw * 0.05;
    qT += raw;
    if (qT > 1) {
      qT = 0;
      if (ema > 0.026) q = Math.max(0.4, q - 0.12);
      else if (ema < 0.019 && q < 1) q = Math.min(1, q + 0.05);
    }
  }

  function frame(now) {
    var raw = (now - last) / 1000;
    last = now;
    var dt = Math.min(0.05, Math.max(0.001, raw));
    tune(raw);
    time += dt;
    phT += dt * 1000;
    while (phT >= DUR[ph]) { phT -= DUR[ph]; enter(ph + 1); }
    var p = phT / DUR[ph];
    var i, m, a = 0, b = 0;

    pxs += (tpx - pxs) * (1 - Math.exp(-dt * 4));
    pys += (tpy - pys) * (1 - Math.exp(-dt * 4));
    ox = pxs * 8; oy = pys * 5;


    var amp = ph === 1 ? 1 : ph === 0 ? (p > 0.92 ? 0.8 : 0.25) : ph === 2 ? 0.25 : 0.1;
    var bp = (time % 0.95) / 0.95;
    var pulse = Math.exp(-Math.pow((bp - 0.03) / 0.07, 2)) + 0.7 * Math.exp(-Math.pow((bp - 0.25) / 0.08, 2));
    beatPulse = pulse * amp;
    bs = 1 + 0.03 * beatPulse;
    var bidx = Math.floor(time / 0.95);
    if (bidx !== lastBeat) { lastBeat = bidx; if (ph === 1) rings.push({ t0: time }); }

    if (ph === 0) { b = N * (0.75 * p + 0.25 * sm(p)); }
    else if (ph === 1) { b = N; }
    else if (ph === 2) { b = N * (1 - (0.75 * p + 0.25 * sm(p))); }

    /* dust storm across the whole screen when the line passes the bottom tip */
    if (ph === 0 && !tipD && b >= N / 2) { tipD = true; tipBlast(); }
    if (ph === 2 && !tipE && b <= N / 2) { tipE = true; tipBlast(); }
    if (ph === 2 && eraseEls.length) {
      var tgt = Math.min(eraseEls.length, Math.floor((1 - b / N) / 0.9 * eraseEls.length));
      while (eraseIdx < tgt) killLetter(eraseEls[eraseIdx++]);
    }

    /* wind for dust */
    if (ph === 2) { windX = -dir * 60 * sc; windY = -42 * sc; }
    else { windX = -dir * 22 * sc; windY = 14 * sc; }

    /* head trail while drawing, front dust while erasing */
    if ((ph === 0 || ph === 2) && b > 1) {
      var mode = ph === 0 ? 0 : 1;
      var hs = scr(b);
      var hx = hs[0], hy = hs[1];
      var t1 = scr(Math.min(N, b + 2)), t0 = scr(Math.max(0, b - 2));
      var tx = t1[0] - t0[0], ty = t1[1] - t0[1];
      var tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      var nearTip = Math.abs(b - N / 2) < 14 ? 3 : 1;
      acc += dt * (mode === 0 ? 520 : 560) * q * nearTip;
      var sg = mode === 0 ? -1 : 1;
      while (acc >= 1) {
        acc -= 1;
        var an = Math.random() * PI2, mg = Math.pow(Math.random(), 0.7) * 85 * sc;
        dust(hx + Math.cos(an) * 5 * sc, hy + Math.sin(an) * 5 * sc,
          Math.cos(an) * mg + tx * sg * 38 * sc + windX * (mode ? 0.9 : 0.4),
          Math.sin(an) * mg + ty * sg * 38 * sc + windY * (mode ? 0.9 : 0.4),
          rnd(1.0, 2.6), rnd(2.6, 6.2) * ss, ci3(), 0);
      }
      if (mode === 1) {
        var from = b, to = Math.min(N, b + N * dt / (DUR[2] / 1000) * 1.1);
        for (i = from; i < to; i += 1) {
          var ip = scr(i);
          for (m = 0; m < 4; m++) {
            var ag = Math.random() * PI2, sp = rnd(15, 115) * sc;
            dust(ip[0] + rnd(-4, 4) * sc, ip[1] + rnd(-4, 4) * sc,
              Math.cos(ag) * sp + windX, Math.sin(ag) * sp + windY,
              rnd(1.6, 3.6), rnd(2.8, 6.4) * ss, ci3(), 0);
          }
        }
      }
    }

    /* orb at the dip */
    if (ph === 3) {
      var dp = dipPos();
      acc += dt * 140 * q;
      while (acc >= 1) {
        acc -= 1;
        var ao = Math.random() * PI2, rr = rnd(4, 40) * sc, sw = rnd(30, 110) * sc;
        dust(dp[0] + Math.cos(ao) * rr, dp[1] + Math.sin(ao) * rr,
          -Math.sin(ao) * sw + windX * 0.3, Math.cos(ao) * sw + windY * 0.3,
          rnd(1.2, 2.8), rnd(2.6, 6) * ss, ci3(), 0);
      }
    }

    /* hold extras */
    if (ph === 1) {
      var ms = phT;
      if (!fwDone[0] && ms > 600) { fwDone[0] = true; firework(); }
      if (!fwDone[1] && ms > 1500) { fwDone[1] = true; firework(); }
      for (i = 0; i < 5; i++) {
        var f = ((time * 0.11 + i / 5) % 1) * N;
        if (Math.random() < 0.7 * q) {
          var sp2 = scr(f);
          dust(sp2[0], sp2[1], rnd(-14, 14) * sc, rnd(-14, 14) * sc, rnd(0.5, 1.1), rnd(2, 4) * ss, pi * 3, 3);
        }
      }
    }

    /* ambient dust, denser while erasing and during the orb */
    var td = ph === 0 ? (tipD ? 0.9 : 0.12) : ph === 1 ? 0.5 : ph === 2 ? 1.3 : 0;
    dens += (td - dens) * (1 - Math.exp(-dt * 1.6));
    var baseAmb = Math.max(150, Math.min(1800, W * H / 1300)) * q;
    accAmb += dt * (baseAmb * dens / 3.6);
    while (accAmb >= 1) {
      accAmb -= 1;
      dust(Math.random() * W, Math.random() * H, rnd(-10, 10) * sc + windX * 0.15, rnd(-10, 10) * sc + windY * 0.15,
        rnd(2.6, 5.4), rnd(2.2, 5.4) * ss, ci3(), 1);
    }

    /* floating hearts */
    accFH += dt * 1.4 * q;
    while (accFH >= 1) {
      accFH -= 1;
      if (FH.length < 26) {
        var fr = Math.random();
        FH.push({ x: Math.random() * W, y: H + 40, vy: rnd(28, 70) * sc, sw: rnd(0.8, 2), sa: rnd(10, 38), ph: rnd(0, PI2),
          sz: rnd(10, 36) * ss, ci: pi * 3 + (fr < 0.5 ? 1 : fr < 0.8 ? 0 : 2), al: rnd(0.3, 0.7), age: 0, d: rnd(0.3, 1) });
      }
    }

    /* shooting stars */
    shootT -= dt;
    if (shootT <= 0) {
      shootT = rnd(3.5, 7);
      var sx = rnd(W * 0.35, W * 1.0), sy = rnd(-20, H * 0.3), spd = rnd(500, 800) * sc;
      shoot.push({ x: sx, y: sy, vx: -spd * 0.8, vy: spd * 0.55, age: 0, life: rnd(0.7, 1.1) });
    }

    /* pointer trail */
    if (ptr.on && time - ptr.t < 0.12) {
      for (m = 0; m < 2; m++) {
        dust(ptr.x + rnd(-8, 8), ptr.y + rnd(-8, 8), rnd(-25, 25) * sc, rnd(-40, 5) * sc, rnd(0.7, 1.4), rnd(4, 9) * ss, ci3(), 3);
      }
    }

    /* ---- gather target for the leftover dust ---- */
    gOn = false;
    if (ph === 3) {
      var dg0 = dipPos();
      gOn = true; gtx = dg0[0]; gty = dg0[1]; orbT = phT / 1000; gpal = (pi + 1) % PAL.length;
    } else if (ph === 0) {
      gf = 1 - sm((p - 0.35) / 0.4);
      if (gf > 0.02) {
        var hg = scr(Math.max(1, b));
        gOn = true; gtx = hg[0]; gty = hg[1]; orbT = 99; gpal = pi;
      }
    }

    /* ---- render ---- */
    ctx.clearRect(0, 0, W, H);
    if (ph === 1 || q >= 0.8) drawRays();
    drawBackdrop(dt);
    drawStars();
    drawFloatHearts(dt);
    drawRings();
    drawParticles(dt);
    drawShoot(dt);

    /* heart: inner glow when closed */
    var closed = ph === 1 ? 1 : ph === 0 ? sm((p - 0.9) / 0.1) : 0;
    if (closed > 0.01) {
      ctx.save();
      ctx.translate(cx + ox, cy + oy);
      ctx.scale(bs, bs);
      var ig = ctx.createRadialGradient(0, 0, 0, 0, 0, S * 0.5);
      ig.addColorStop(0, rgba(pal.mid, 0.2 * closed));
      ig.addColorStop(1, rgba(pal.tail, 0.03 * closed));
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = ig;
      ctx.fill(ringPath);
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }

    if (b > 0.5) {
      strokeRange(0, b, ph === 0 || ph === 2);

      /* bright tip at the bottom of the heart */
      var tipVis = sm((b - N / 2) / 8);
      if (tipVis > 0) {
        var tip = scr(N / 2);
        var tw = S * 0.03, th = S * 0.075;
        var tg = ctx.createLinearGradient(0, tip[1] - th * 0.4, 0, tip[1] + th);
        tg.addColorStop(0, rgba(mix(pal.head, [255, 255, 255], 0.5), 0.95 * tipVis));
        tg.addColorStop(1, rgba(pal.mid, 0));
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = tg;
        ctx.fillRect(tip[0] - tw / 2, tip[1] - th * 0.4, tw, th * 1.4);
        ctx.globalCompositeOperation = 'source-over';
        glow(tip[0], tip[1] + th * 0.2, S * (0.09 + 0.02 * beatPulse), pal.head, 0.5 * tipVis);
      }

      /* glint travelling around the outline while it holds */
      if (ph === 1) {
        var gi = ((time * 0.35) % 1) * N;
        var ga = Math.max(0, gi - 14), gb = Math.min(N, gi + 14);
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = Math.max(2, S * 0.011) * 1.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        var q0 = ptAt(ga);
        ctx.moveTo(X(q0[0]), Y(q0[1]));
        for (var jj = Math.floor(ga) + 1; jj < gb; jj++) ctx.lineTo(X(pts[jj][0]), Y(pts[jj][1]));
        var q1 = ptAt(gb);
        ctx.lineTo(X(q1[0]), Y(q1[1]));
        ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
        var gp = scr(gi);
        flare(gp[0], gp[1], S * 0.025, pal.head, 0.8);

        /* orbiting sparkles */
        for (i = 0; i < 5; i++) {
          var sf = ((time * 0.11 + i / 5) % 1) * N;
          var sq = scr(sf);
          flare(sq[0], sq[1], S * 0.012 * (0.8 + 0.4 * Math.sin(time * 5 + i)), pal.head, 0.8);
        }
      }

      /* head glow with lens streak */
      if (ph === 0 || ph === 2) {
        var hp = scr(b);
        glow(hp[0], hp[1], S * 0.09, pal.head, 0.8);
        glow(hp[0], hp[1], S * 0.04, [255, 255, 255], 0.95);
        ctx.globalCompositeOperation = 'lighter';
        var lg = ctx.createLinearGradient(hp[0] - S * 0.2, hp[1], hp[0] + S * 0.2, hp[1]);
        lg.addColorStop(0, rgba(pal.head, 0));
        lg.addColorStop(0.5, rgba(pal.head, 0.45));
        lg.addColorStop(1, rgba(pal.head, 0));
        ctx.fillStyle = lg;
        ctx.fillRect(hp[0] - S * 0.2, hp[1] - 1, S * 0.4, 2);
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    /* orb that swallows the scattered dust */
    if (ph === 3) {
      var op = dipPos();
      var nxt = PAL[(pi + 1) % PAL.length];
      var oc = mix(pal.head, nxt.head, sm((p - 0.15) / 0.7));
      var frac = Math.min(1, gAbs / Math.max(1, gTotal * 0.85));
      var orad = S * (0.03 + 0.11 * frac) * (1 + 0.12 * Math.sin(time * 14));
      glow(op[0], op[1], orad * 3.2, oc, 0.35 + 0.35 * frac);
      glow(op[0], op[1], orad * 1.3, mix(oc, [255, 255, 255], 0.6), 0.5 + 0.45 * frac);
      flare(op[0], op[1], orad * 0.55, oc, 0.9);
    }

    drawPops();

    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  window.addEventListener('pointermove', function (e) {
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; ptr.t = time;
    tpx = (e.clientX / W - 0.5) * 2;
    tpy = (e.clientY / H - 0.5) * 2;
  });
  document.addEventListener('pointerdown', function (e) {
    var n = performance.now();
    ptr.x = e.clientX; ptr.y = e.clientY;
    tpx = (e.clientX / W - 0.5) * 2;
    tpy = (e.clientY / H - 0.5) * 2;
    pops.push({ x: e.clientX, y: e.clientY, t0: time, type: 2, pi: pi });
    burst(e.clientX, e.clientY, Math.round(34 * q), 210 * sc, 1.7, 2, pi);
    if (n - lastTap < 320 && ph < 3) { phT = 0; enter(3); }
    lastTap = n;
  });
  window.addEventListener('resize', layout);

  /* ---------- start ---------- */
  layout();
  wordEl.style.color = pal.text;
  showPhrase(PHRASES[0], true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  if (reduce) {
    ph = 1; phT = 1000;
    var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    bg.addColorStop(0, rgba(pal.glow, 0.55));
    bg.addColorStop(1, rgba(pal.glow, 0));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    drawStars();
    strokeRange(0, N, false);
    window.addEventListener('resize', function () {
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
      strokeRange(0, N, false);
    });
    return;
  }

  for (var pf = 0; pf < Math.round(Math.min(900, W * H / 2200)); pf++) {
    dust(Math.random() * W, Math.random() * H, rnd(-10, 10), rnd(-10, 10), rnd(2.6, 5.4), rnd(2.2, 5.4) * ss, ci3(), 1);
    P[P.length - 1].age = Math.random() * P[P.length - 1].life * 0.8;
  }
  for (var ff = 0; ff < 10; ff++) {
    FH.push({ x: Math.random() * W, y: rnd(H * 0.2, H), vy: rnd(28, 70) * sc, sw: rnd(0.8, 2), sa: rnd(10, 38), ph: rnd(0, PI2),
      sz: rnd(10, 36) * ss, ci: 1, al: rnd(0.2, 0.55), age: 2, d: rnd(0.3, 1) });
  }
  requestAnimationFrame(function (t0) { last = t0; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
